[project]
name = "ambient-er-triage"
version = "0.1.0"
description = "Ambient ER intake: speech-to-text, Gemini dialect JSON, Jev scoring, asymmetric loss, nurse confirmation sheet."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "reportlab==5.0.1",
    "plotly==7.1.0",
    "streamlit==1.65.0",
    "google-genai==2.28.0",
    "typesafe-sdk==0.7.2",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.2",
    "av==16.1.0",
    "pypdfium2==5.14.0",
    "pillow==12.3.0",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "segno==1.6.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pypdf==6.19.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
